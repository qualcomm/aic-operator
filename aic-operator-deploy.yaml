apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: aics.aic.qualcomm.com
spec:
  group: aic.qualcomm.com
  names:
    kind: AIC
    listKind: AICList
    plural: aics
    singular: aic
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: AIC is the Schema for the aics API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AICSpec defines the desired state of AIC
            properties:
              devPluginVersion:
                description: version of the device plugin image
                type: string
              deviceAgentImage:
                description: QAIC Device Agent image
                type: string
              deviceAgentVersion:
                description: version of the Device Agent image
                type: string
              devicePluginImage:
                description: device plugin image
                type: string
              driversImage:
                description: defines image that includes drivers and firmware blobs
                type: string
              driversVersion:
                description: version of the drivers source code, can be used as part
                  of image of dockerfile source image
                type: string
              imageRepoSecret:
                description: pull secrets used for pull/setting images used by operator
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              selector:
                additionalProperties:
                  type: string
                description: Selector describes on which nodes the AIC Operator should
                  enable the AIC device.
                type: object
              sourceImage:
                description: defines image that includes driver source and firmware
                type: string
              useInTreeModules:
                description: UseInTreeModules used to prefer in-tree modules, if not
                  available still tries to build
                type: boolean
            required:
            - devPluginVersion
            - deviceAgentImage
            - deviceAgentVersion
            - devicePluginImage
            - driversImage
            - driversVersion
            - sourceImage
            type: object
          status:
            description: AICStatus defines the observed state of AIC
            properties:
              state:
                description: |-
                  INSERT ADDITIONAL STATUS FIELD - define observed state of cluster
                  Important: Run "make" to regenerate code after modifying this file
                enum:
                - Ignored
                - Ready
                - NotReady
                type: string
            required:
            - state
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
